<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Hace que la pagina se adapte a diferentes tamaños de pantalla,
         como celulares, tablets y computadoras. -->

    <title>Salto de linea en HTML</title>
    <!-- Define el titulo que aparece en la pestaña del navegador. -->

</head>
<!-- Cierra la sección <head>. -->

<body>
    <!-- Contiene todo el contenido visible de la página web. -->

    <h1>Lenguaje de programacion</h1>
    <!-- Crea un encabezado de nivel 1. Es el título principal que se muestra en la pagina. -->

    <p>En la actualidad se utilizan diferentes
        lenguajes de programacion tanto para desarrollo
        web, desarrollo movil, entranamiento de inteligencia
        artificial, pero de los mas usados son
        los siguientes:<br>
        <!-- <p> inicia un párrafo.
             Todo el texto que está dentro de <p> forma parte
             del mismo parrafo.
             
             <br> realiza un salto de línea.
             Hace que el contenido que sigue aparezca en
             la siguiente linea. -->

        Dart<br>
        <!-- Muestra "Dart" y <br> hace un salto de linea. -->

        Flutter<br>
        <!-- Muestra "Flutter" y <br> hace un salto de linea. -->

        Python<br>
        <!-- Muestra "Python" y <br> hace un salto de linea. -->

        Ruby<br>
        <!-- Muestra "Ruby" y <br> hace un salto de linea. -->

        Java<br>
        <!-- Muestra "Java" y <br> hace un salto de linea. -->

        TypeScript<br>
        <!-- Muestra "TypeScript" y <br> hace un salto de linea. -->

        Entre otros.
        <!-- Muestra el texto "Entre otros." -->
    </p>
    <!-- Cierra el parrafo. -->

</body>
<!-- Cierra el contenido visible de la página. -->

</html>
