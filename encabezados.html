<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Hace que la página se adapte a diferentes tamaños de pantalla,
         como celulares, tablets y computadoras. -->

    <title>Encabezados HTML</title>
    <!-- Define el título que aparece en la pestaña del navegador. -->

</head>
<!-- Cierra la sección <head>. -->

<body>
    <!-- Contiene todo el contenido de la pagina web. -->

    <!-- Encabezados -->
    <!-- Se definen con la etiqueta h, seguido
         del numero correspondiente de tamaño y/o
         importancia -->

    <h1>Titulo 1</h1>
    <!-- <h1> crea el encabezado de mayor nivel o importancia.
         Generalmente se utiliza para el titulo principal de la pagina. -->

    <h2>Titulo 2</h2>
    <!-- <h2> crea un encabezado de segundo nivel.
         Se utiliza normalmente para una seccion principal. -->

    <h3>Titulo 3</h3>
    <!-- <h3> crea un encabezado de tercer nivel.
         Puede utilizarse para una subseccion dentro de un <h2>. -->

    <h4>Titulo 4</h4>
    <!-- <h4> crea un encabezado de cuarto nivel. -->

    <h5>Titulo 5</h5>
    <!-- <h5> crea un encabezado de quinto nivel. -->

    <h6>Titulo 6</h6>
    <!-- <h6> crea un encabezado de sexto nivel.
         Es el nivel más bajo de los encabezados HTML. -->

</body>
<!-- Cierra el contenido visible de la página. -->

</html>
