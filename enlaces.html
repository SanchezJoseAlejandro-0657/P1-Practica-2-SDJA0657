<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Define el título de la pagina que sale en la parte del navegador -->
    <title>Enlaces en HTML</title>

</head>

<body>
    <!-- Comienza el cuerpo  que contiene todo el contenido visible de la pagina -->

    <!-- Define un titulo de segundo nivel (subtitulo) de tamaño destacado en la pantalla -->
    <h2>Tipos de enlaces en HTML</h2>

    <!-- Crea un parrafo con texto en negrita (<strong>) para tener una categoria de la siguiente seccion -->
    <p><strong>Enlaces/Hipervinculos a otra pagina del mismo sitio.</strong></p>

    <!-- Enlace interno basico: Se abre en la misma pestaña -->
    <a href="1. Hola_mundo.html">1. Hola Mundo</a>
    <!-- Inserta un salto de linea para forzar al siguiente elemento a ir abajo -->
    <br>

    <!-- Enlace interno con target="_self": Se abre solamente en la misma pestaña o marco actual -->
    <a href="2. Encabezados.html" target="_self">2. Encabezados</a><br>

    <!-- Enlace interno con target="_blank": Abre el archivo en una pestaña o ventana nueva del navegador -->
    <a href="3. Parrafos.html" target="_blank">3. Parrafos</a><br>

    <!-- Enlace interno con target="_parent": Abre el archivo en el marco padre  -->
    <a href="4. Salto de linea.html" target="_parent">4. Salto de linea</a><br>

    <!-- Enlace interno con target="_top": Cancela todos los marcos y abre el archivo ocupando toda la ventana -->
    <a href="5. Enfatizado.html" target="_top">5. Enfatizado</a><br>

    <!-- Crea otro parrafo en negrita para introducir la seccion de sitios externos -->
    <p><strong>Enlaces/Hipervinculos a sitios externos</strong></p>

    <!-- Enlace externo basico a Google: Se abre por defecto sobre la pestaña actual -->
    <a href="https://www.google.com/">Google</a><br>

    <!-- Enlace externo a YouTube: Forzado por "_self" a cargar en la pestaña actual -->
    <a href="https://www.youtube.com/" target="_self">YouTube</a><br>

    <!-- Enlace externo a Facebook: Abre la red social de forma segura en una nueva pestaña  -->
    <a href="https://www.facebook.com/" target="_blank">FaceBook</a><br>

    <!-- Enlace externo a Wikipedia: Se despliega dentro del contenedor o marco padre inmediato -->
    <a href="https://www.wikipedia.com/" target="_parent">WikiPedia</a><br>

    <!-- Enlace externo a Yahoo: Elimina marcos anidados y toma el control completo de la ventana del navegador -->
    <a href="https://www.espanol.yahoo.com/" target="_top">Yahoo!</a><br>

<!-- Finaliza el cuerpo de la pagina web -->
</body>

</html>
